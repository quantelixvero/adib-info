<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Engineering & Special | CourseLink</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar"></nav>

<!-- PAGE HEADER -->
<section style="padding:44px 0 32px;border-bottom:1px solid #1e2535;">
  <div class="container">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
      <div style="width:40px;height:40px;border-radius:10px;background:rgba(244,63,94,0.12);display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:#fb7185;">
        <i class="bi bi-cpu"></i>
      </div>
      <span style="font-size:0.8rem;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:0.07em;">Engineering & Admission</span>
    </div>
    <h1 style="font-size:clamp(1.7rem,4vw,2.5rem);font-weight:800;margin-bottom:10px;line-height:1.2;">
      Engineering <span style="background:linear-gradient(135deg,#f43f5e,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">& Special Courses</span>
    </h1>
    <p style="color:#64748b;font-size:0.95rem;max-width:560px;line-height:1.7;">
      BP Engineering Chemistry 25 by Saikat Sir — BUET, CKET and top engineering university admission preparation.
    </p>
  </div>
</section>

<!-- COURSES -->
<section class="container" style="padding-top:32px;">

  <div class="search-section">
    <div class="search-bar">
      <i class="bi bi-search"></i>
      <input type="search" id="searchInput"
        placeholder="Search engineering cycles — e.g. Saikat Sir, BP, BUET Chem..."
        autocomplete="off" />
      <button class="clear-btn" id="searchClear"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="filter-row">
      <span class="filter-label">Subject:</span>
      <div id="subjectFilters" style="display:contents;"></div>
      <span class="result-count" id="resultCount"></span>
    </div>
  </div>

  <div class="courses-grid" id="coursesGrid"></div>

</section>

<footer class="footer site-footer"></footer>

<script>window.PAGE_BATCH = 'Engineering';</script>
<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    initNavbar('special');
    initFooter();
  });
</script>
</body>
</html>
